# Test configuration — replaces src/main/resources/application.properties during tests.
# Does NOT import google.properties; provides all required values inline with dummy keys
# so the Spring context starts without real API credentials.
spring.application.name=GuessMe
google.api.key=test-key
google.search.cx=test-cx
cors.allowed-origins=http://localhost:5173
gemini.model=gemini-2.0-flash-lite

# Game limits — relaxed for testing.
# Cooldown disabled so tests can make back-to-back calls without timing issues.
# Question/hint limits at production defaults; limit-specific tests build their own
# GameService instance with tighter bounds via new GameProperties().
game.max-question-length=300
game.max-sessions=200
game.session-ttl-minutes=60
game.max-questions-per-session=50
game.max-hints-per-session=10
game.request-cooldown-ms=0
