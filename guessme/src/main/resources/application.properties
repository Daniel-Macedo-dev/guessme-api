spring.application.name=GuessMe

# Server port. Defaults to 8080.
# PaaS platforms (Railway, Render, Fly.io) inject PORT; SERVER_PORT is the Spring-native name.
server.port=${PORT:${SERVER_PORT:8080}}

# google.properties is optional; if absent the image-search feature is silently disabled.
# Provide values via environment variables (GOOGLE_API_KEY, GOOGLE_SEARCH_CX)
# or by copying google.properties.example → google.properties and filling in your keys.
spring.config.import=optional:classpath:google.properties

# CORS origins allowed to call the API.
# For local Vite dev: http://localhost:5173 (default).
# Override via CORS_ALLOWED_ORIGINS env var or by editing this file.
cors.allowed-origins=http://localhost:5173

# Gemini model used for game responses and hints.
# Override via GEMINI_MODEL env var or gemini.properties.
gemini.model=gemini-2.0-flash-lite

# Game limits — all limits are enforced in memory per instance.
# Distributed deployments need external rate limiting (e.g., API Gateway).
game.max-question-length=300
game.max-sessions=200
game.session-ttl-minutes=60
game.max-questions-per-session=50
game.max-hints-per-session=10
game.request-cooldown-ms=3000

